name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: bundle exec rake demo
      - run: git diff --exit-code -- docs/media
      - run: bundle exec rake demo
      - run: git diff --exit-code -- docs/media
      - run: ruby tools/build_docs.rb --check
      - name: Check media budget
        shell: bash
        run: |
          for file in docs/media/*.png docs/media/*.apng; do
            test "$(stat -c%s "$file")" -le 524288
          done

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
        ruby: ['3.1', '3.2', '3.3', '3.4', '4.0']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      BUNDLE_PATH: .bundle/gems
      GOLDEN: skip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby }}
      - run: bundle install
      - run: bundle exec rake test
      - run: gem build --strict zaniah.gemspec
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          # Performance budgets run on the current supported Ruby; older versions remain in the test matrix.
          ruby-version: '3.4'
      - run: bundle install
      - run: bundle exec rake test:golden
      - name: Verify Vulkan Scene rendering and native IME
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers xvfb xdotool dbus-x11 ibus ibus-kkc
          ruby test/support/vulkan_scene_smoke.rb
          dbus-run-session -- test/support/linux_ime_smoke.sh
      - name: Verify AT-SPI provider queries
        run: dbus-run-session -- ruby test/support/linux_atspi_smoke.rb
      - run: bundle exec rake bench BUDGET=1
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: golden-diff
          path: test/golden/diff/
          if-no-files-found: ignore
  types:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.4'
      - run: bundle install
      - run: bundle exec rake rbs
      - run: ruby test/type/check.rb
