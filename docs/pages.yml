pages:
  - path: index.html
    kind: guide
    group: Getting started
    title: Introduction
    lead: "Build native windows, terminal interfaces, and deterministic PNGs from the same Ruby element tree."
    sections:
      - heading: Requirements
        text:
          - "Zaniah runs on CRuby 3.1 or newer. Add the gem to your Gemfile and install it with Bundler. The component library is opt-in: load `zaniah/ui` when you need controls."
        code_label: Gemfile
        code: |
          gem "zaniah"
      - heading: Your first image
        text:
          - "Use the headless backend to render a frame without opening a desktop window. Save the result as a PNG, which is also useful for visual tests."
        code_label: hello.rb
        code: |
          require "zaniah"

          window = Zaniah::Platform.open_window(
            backend: :headless, width: 480, height: 240
          )
          window.text_system = Zaniah::TextSystem::Renderer.new
          window.draw do
            Zaniah::Div.new.flex_col.p(24).gap(12).bg("#161b22")
              .child(Zaniah::Text.new("Hello, Ruby", size: 24))
              .child(Zaniah::Text.new("A native toolkit, written in Ruby."))
          end
          window.tick
          window.write_png("hello.png")
          window.close
        note: "Run `bundle exec ruby hello.rb` to create `hello.png` in the current directory."
      - heading: Open a window
        text:
          - "Switch to a native backend and call `run` instead of rendering a single frame. Load `zaniah/ui` to use the component library."
        code_label: app.rb
        code: |
          require "zaniah/ui"

          window = Zaniah::Platform.open_window(
            backend: :mac, width: 640, height: 360
          )
          window.draw do
            Zaniah::Div.new.flex_col.p(24).gap(12)
              .child(Zaniah::UI::Label.new("Hello, Zaniah", size: :xl))
              .child(Zaniah::UI::Button.new("Save", variant: :primary)
                .on_click { puts "Saved" })
          end
          window.run
        note: "Use `:linux`, `:windows`, or `:tui` for other interactive backends. See the Native backends guide for platform requirements."
      - heading: Next steps
        text:
          - "Open Guides for platform and API topics, or Components overview to find the right control. Each component page shows a rendered example, Ruby code, constructor options, and accessibility roles."

  - path: components/index.html
    kind: index
    group: Getting started
    title: Components overview
    lead: "Browse the components by task. Every page includes a real Zaniah rendering and the Ruby API that produces it."

  - path: guides/index.html
    kind: index
    group: Getting started
    directory_group: Guides
    title: Guides
    lead: "Go deeper into Zaniah's rendering, layout, text, platforms, and application APIs."

  - path: guides/native.html
    kind: markdown
    group: Guides
    title: Native backends
    lead: "Open windows, exchange clipboard data, handle file drops, and work with displays."
    source: native.md
  - path: guides/layout.html
    kind: markdown
    group: Guides
    title: Layout and scrolling
    lead: "Compose flex and grid layouts, resizable panes, virtual grids, and scroll views."
